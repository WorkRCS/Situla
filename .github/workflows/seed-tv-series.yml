name: catalogue-seed

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: situla-catalogue-seed
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MONGODB_URI: \${{ secrets.MONGODB_URI }}
      MONGODB_DB_NAME: \${{ secrets.MONGODB_DB_NAME }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate MongoDB credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$MONGODB_URI" || -z "$MONGODB_DB_NAME" ]]; then
            echo "::error::Add MONGODB_URI and MONGODB_DB_NAME as GitHub Actions secrets."
            exit 1
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run the single catalogue seed
        run: npm run seed

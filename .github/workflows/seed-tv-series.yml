name: seed-tv-and-static-catalog

on:
  workflow_dispatch:
    inputs:
      catalog:
        description: "Which static catalogue should be seeded"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - movies
          - tv
          - anime

permissions:
  contents: read

concurrency:
  group: situla-static-catalog-seed
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate MongoDB credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$MONGODB_URI" || -z "$MONGODB_DB_NAME" ]]; then
            echo "::error::Add MONGODB_URI and MONGODB_DB_NAME as GitHub Actions secrets."
            exit 1
          fi
          echo "Movie seed uses public Cinemeta metadata by IMDb ID; no TMDb token is required."
          echo "TV seed verifies public TVmaze metadata and artwork before writing; no video files or stream URLs are imported."

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Seed selected static catalogue
        shell: bash
        run: |
          case "${{ inputs.catalog }}" in
            movies) npm run seed:movies ;;
            tv) npm run seed:tv ;;
            anime) npm run seed:anime ;;
            all) npm run seed:catalog ;;
            *) echo "Unknown catalogue option" >&2; exit 1 ;;
          esac
